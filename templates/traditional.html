{% extends "base.html" %}

{% block content %}
<section class="grid gap-6 xl:grid-cols-[22rem_minmax(0,1fr)]">
  <aside class="card h-fit border border-base-300 bg-base-100 shadow-sm xl:sticky xl:top-24">
    <form id="filters-form" action="/locations" method="get" class="card-body gap-4 p-4 sm:p-6">
      <div>
        <h2 class="card-title">Search and filters</h2>
        <p class="mt-1 text-sm text-base-content/60">Submitting or changing a filter navigates to a complete HTML document.</p>
      </div>
      <label class="form-control w-full"><span class="label-text mb-2 font-semibold">Search every hierarchy level</span>
        <div class="join w-full">
          <input class="input input-bordered join-item min-w-0 flex-1" type="search" name="query" value="{{ view.query.query }}" placeholder="Try Kigali…">
          <button class="btn btn-primary join-item" type="submit">Search</button>
        </div>
      </label>
      <div class="divider my-0 text-xs text-base-content/45">FULL-PAGE CASCADE</div>
      <label class="form-control"><span class="label-text mb-2 font-semibold">Province</span><select id="province" data-level="provinces" class="select select-bordered" name="province" onchange="resetCascade(['district','sector','cell','village']); this.form.submit()"><option value="">All provinces</option>{% for option in view.provinces %}<option value="{{ option.value }}" {% if option.selected %}selected{% endif %}>{{ option.value }}</option>{% endfor %}</select></label>
      <label class="form-control"><span class="label-text mb-2 font-semibold">District</span><select id="district" data-level="districts" class="select select-bordered" name="district" onchange="resetCascade(['sector','cell','village']); this.form.submit()"><option value="">All districts</option>{% for option in view.districts %}<option value="{{ option.value }}" {% if option.selected %}selected{% endif %}>{{ option.value }}</option>{% endfor %}</select></label>
      <label class="form-control"><span class="label-text mb-2 font-semibold">Sector</span><select id="sector" data-level="sectors" class="select select-bordered" name="sector" onchange="resetCascade(['cell','village']); this.form.submit()"><option value="">All sectors</option>{% for option in view.sectors %}<option value="{{ option.value }}" {% if option.selected %}selected{% endif %}>{{ option.value }}</option>{% endfor %}</select></label>
      <label class="form-control"><span class="label-text mb-2 font-semibold">Cell</span><select id="cell" data-level="cells" class="select select-bordered" name="cell" onchange="resetCascade(['village']); this.form.submit()"><option value="">All cells</option>{% for option in view.cells %}<option value="{{ option.value }}" {% if option.selected %}selected{% endif %}>{{ option.value }}</option>{% endfor %}</select></label>
      <label class="form-control"><span class="label-text mb-2 font-semibold">Village</span><select id="village" data-level="villages" class="select select-bordered" name="village" onchange="this.form.submit()"><option value="">All villages</option>{% for option in view.villages %}<option value="{{ option.value }}" {% if option.selected %}selected{% endif %}>{{ option.value }}</option>{% endfor %}</select></label>
      <div class="divider my-0 text-xs text-base-content/45">TEST CONTROL</div>
      <label class="form-control"><span class="label-text mb-2 font-semibold">Simulated delay (ms)</span><input class="input input-bordered" type="number" name="delay_ms" min="0" max="10000" value="{{ view.query.delay_ms }}"></label>
      <input type="hidden" name="per_page" value="{{ view.query.per_page }}">
      <button class="btn btn-secondary" type="submit">Apply with full reload</button>
      <a href="/traditional" class="btn btn-ghost btn-sm">Clear all filters</a>
    </form>
  </aside>
  <div id="results" class="min-w-0">{{ view.results_html|safe }}</div>
</section>
{% endblock %}
